<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Tracker</title>
    <script>
        // Apply dark mode synchronously before stylesheet to avoid FOUC.
        (function () {
            try {
                var stored = localStorage.getItem('darkMode');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var dark = stored === 'dark' || ((stored === null || stored === 'system') && prefersDark);
                if (dark) document.documentElement.classList.add('dark');
            } catch (e) { /* localStorage may be disabled */ }
        })();
    </script>
    <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <!-- Auth Overlay (full-screen until logged in) -->
    <div id="authOverlay" class="auth-overlay hidden">
        <div class="auth-card">
            <div class="auth-brand">
                <svg class="w-10 h-10 text-blue-600 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
                <h2>Stock Tracker</h2>
                <p class="auth-tagline">登录后多设备同步你的股票收藏</p>
            </div>
            <div class="auth-tabs" role="tablist">
                <button type="button" class="auth-tab active" data-auth-tab="login">登录</button>
                <button type="button" class="auth-tab" data-auth-tab="register">注册</button>
            </div>
            <div id="authOnboardingBanner" class="auth-banner hidden"></div>
            <form id="loginForm" class="auth-form">
                <label>邮箱
                    <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
                </label>
                <label>密码
                    <input type="password" name="password" required autocomplete="current-password" minlength="6">
                </label>
                <button type="submit" class="auth-submit">登录</button>
            </form>
            <form id="registerForm" class="auth-form hidden">
                <label>邮箱
                    <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
                </label>
                <label>密码 (≥6 位)
                    <input type="password" name="password" required autocomplete="new-password" minlength="6">
                </label>
                <label>邀请码
                    <input type="text" name="inviteCode" required autocomplete="off" placeholder="向管理员索取">
                </label>
                <button type="submit" class="auth-submit">注册并登录</button>
            </form>
            <div id="authError" class="auth-error hidden"></div>
        </div>
    </div>

    <!-- Navigation Header -->
    <header class="sticky top-0 z-50 backdrop-blur-xl bg-white/80 dark:bg-gray-900/80 border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
            <div class="app-header-inner">
                <div class="app-header-brand">
                    <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                    </svg>
                    <h1 class="text-xl font-semibold whitespace-nowrap">Stock Tracker</h1>
                </div>
                <div class="global-search-wrap">
                    <svg class="global-search-icon w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input id="globalSearch" type="search" autocomplete="off" placeholder="搜索股票代码或公司名称 (按 / 快速聚焦)"
                        class="global-search-input">
                    <span class="global-search-kbd">/</span>
                    <div id="globalSearchResults" class="global-search-results hidden"></div>
                </div>
                <div id="viewToggle" class="view-toggle" role="tablist" aria-label="View mode">
                    <button type="button" class="view-toggle-btn" data-view="list" title="List view">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <button type="button" class="view-toggle-btn" data-view="cards" title="Cards view">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                        </svg>
                    </button>
                    <button type="button" class="view-toggle-btn" data-view="grid" title="History grid view">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <rect x="3" y="4" width="18" height="16" rx="2" stroke-width="2"></rect>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 16h18M9 4v16M15 4v16"></path>
                        </svg>
                    </button>
                </div>
                <button id="syncAllBtn" class="header-icon-btn" title="Sync All">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
                <button id="darkToggleBtn" class="header-icon-btn" title="Toggle dark mode">
                    <svg class="w-5 h-5 dark-toggle-icon-light" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                    <svg class="w-5 h-5 dark-toggle-icon-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                </button>
                <button id="addStockBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl flex items-center space-x-2 transition-all duration-200 flex-shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    <span class="hidden sm:inline">Add Stock</span>
                </button>
                <button id="logoutBtn" class="header-icon-btn hidden" title="Logout">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Loading State -->
        <div id="loadingState" class="flex justify-center items-center h-64">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <svg class="mx-auto h-24 w-24 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
            </svg>
            <h3 class="mt-4 text-lg font-medium text-gray-900 dark:text-gray-100">No stocks tracked</h3>
            <p class="mt-2 text-gray-500 dark:text-gray-400">Get started by adding your first stock to track.</p>
            <button id="emptyAddStockBtn" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl transition-all duration-200">
                Add Your First Stock
            </button>
        </div>

        <!-- Stock Grid View -->
        <div id="stocksContainer" class="stocks-grid hidden">
            <!-- Stock cards will be dynamically inserted here -->
        </div>
    </main>

    <!-- Add Stock Modal -->
    <div id="addStockModal" class="hidden fixed inset-0 z-50 overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 transition-opacity" aria-hidden="true">
                <div class="absolute inset-0 bg-gray-500 dark:bg-gray-900 opacity-75"></div>
            </div>
            <div class="inline-block align-bottom bg-white dark:bg-gray-800 rounded-2xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="px-6 pt-6 pb-4">
                    <h3 class="text-xl font-semibold text-gray-900 dark:text-gray-100">Add Stock</h3>
                    <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">Enter a stock symbol to track its performance</p>
                </div>
                <form id="addStockForm" class="px-6 pb-6">
                    <div class="space-y-4">
                        <div class="relative">
                            <label for="stockSymbol" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Stock Symbol / Company Name</label>
                            <input type="text" id="stockSymbol" name="symbol" required
                                class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white"
                                placeholder="搜索股票代码或公司名称 (e.g., 苹果, Apple, AAPL)" autocomplete="off">
                            <div id="stockSearchResults" class="absolute z-50 w-full mt-1 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded-xl shadow-lg max-h-60 overflow-y-auto hidden">
                                <!-- Search results will appear here -->
                            </div>
                        </div>
                        <div>
                            <label for="stockName" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Company Name (Optional)</label>
                            <input type="text" id="stockName" name="name"
                                class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white"
                                placeholder="e.g., Apple Inc.">
                        </div>
                    </div>
                    <div class="mt-6 flex space-x-3">
                        <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-medium transition-all duration-200">
                            Add Stock
                        </button>
                        <button type="button" id="cancelAddStockBtn" class="flex-1 bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 py-3 rounded-xl font-medium transition-all duration-200">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- K-line Chart Modal -->
    <div id="chartModal" class="hidden fixed inset-0 z-50 overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 transition-opacity" aria-hidden="true">
                <div class="absolute inset-0 bg-gray-500 dark:bg-gray-900 opacity-75"></div>
            </div>
            <div class="inline-block align-bottom bg-white dark:bg-gray-800 chart-modal-container rounded-2xl text-left overflow-hidden transform transition-all sm:my-8 sm:align-middle sm:max-w-6xl sm:w-full">
                <div class="px-6 pt-6 pb-4 border-b border-gray-200 dark:border-gray-700">
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="text-xl font-semibold text-gray-900 dark:text-gray-100" id="chartTitle">Stock Chart</h3>
                            <p class="text-sm text-gray-500 dark:text-gray-400" id="chartSubtitle">Historical performance</p>
                        </div>
                        <button id="closeChartModalBtn" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">
                            <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="px-6 py-4">
                    <div class="mb-4 flex items-center space-x-4">
                        <div id="chartPeriodGroup" class="chart-period-group" role="tablist">
                            <button type="button" class="chart-period-btn" data-period="1">1D</button>
                            <button type="button" class="chart-period-btn" data-period="5">5D</button>
                            <button type="button" class="chart-period-btn" data-period="30">30D</button>
                            <button type="button" class="chart-period-btn" data-period="60">60D</button>
                            <button type="button" class="chart-period-btn active" data-period="90">90D</button>
                            <button type="button" class="chart-period-btn" data-period="180">180D</button>
                            <button type="button" class="chart-period-btn" data-period="365">365D</button>
                        </div>
                        <button id="refreshChart" class="chart-refresh-btn">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                            <span>Refresh</span>
                        </button>
                    </div>
                    <div class="chart-canvas-container p-4 relative">
                        <canvas id="candlestickChart" width="800" height="400"></canvas>
                        <div id="chartTooltip" class="chart-tooltip hidden"></div>
                    </div>
                    <div class="mt-4 chart-stats-grid">
                        <div class="chart-stat-item">
                            <div class="chart-stat-label">涨跌幅</div>
                            <div class="chart-stat-value" id="chartChangePct">-</div>
                            <div class="chart-stat-sub" id="chartChangeAbs">-</div>
                        </div>
                        <div class="chart-stat-item">
                            <div class="chart-stat-label">区间最高</div>
                            <div class="chart-stat-value" id="chartPeriodHigh">-</div>
                            <div class="chart-stat-sub" id="chartPeriodHighDate">-</div>
                        </div>
                        <div class="chart-stat-item">
                            <div class="chart-stat-label">区间最低</div>
                            <div class="chart-stat-value" id="chartPeriodLow">-</div>
                            <div class="chart-stat-sub" id="chartPeriodLowDate">-</div>
                        </div>
                        <div class="chart-stat-item">
                            <div class="chart-stat-label">均量</div>
                            <div class="chart-stat-value" id="chartAvgVolume">-</div>
                            <div class="chart-stat-sub">per candle</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile detail overlay (full-screen, replaces K-line modal on phones) -->
    <div id="mobileDetail" class="mobile-detail hidden">
        <div class="md-nav">
            <button type="button" class="md-nav-back" id="mdBack" aria-label="Back">‹</button>
            <div class="md-nav-title">
                <div class="md-nav-symbol" id="mdSymbol">—</div>
                <div class="md-nav-name" id="mdName">—</div>
            </div>
            <button type="button" class="md-nav-action" id="mdPin" title="Pin">★</button>
            <button type="button" class="md-nav-action" id="mdSync" title="Sync">↻</button>
        </div>
        <div class="md-hero">
            <div class="md-hero-price mono" id="mdPrice">—</div>
            <div class="md-hero-change">
                <span class="md-hero-change-text mono" id="mdChange">—</span>
                <span class="md-hero-change-time" id="mdLastUpdate"></span>
            </div>
        </div>
        <div class="md-period-tabs" id="mdPeriodTabs">
            <button type="button" class="md-period-tab" data-md-period="1">1D</button>
            <button type="button" class="md-period-tab" data-md-period="5">5D</button>
            <button type="button" class="md-period-tab" data-md-period="30">1M</button>
            <button type="button" class="md-period-tab is-active" data-md-period="90">3M</button>
            <button type="button" class="md-period-tab" data-md-period="180">6M</button>
            <button type="button" class="md-period-tab" data-md-period="365">1Y</button>
        </div>
        <div class="md-card">
            <div class="md-chart-wrap">
                <div id="mdTooltipStrip" class="md-tooltip-strip hidden"></div>
                <canvas id="mdChart"></canvas>
                <div id="mdCrosshair" class="md-crosshair hidden"></div>
            </div>
        </div>
        <div class="md-card">
            <div class="md-card-title">今日 OHLCV</div>
            <div class="md-ohlc-grid" id="mdOhlc"></div>
            <div class="md-section-divider">
                <div style="display:flex; justify-content:space-between; font-size:10px; color:#6b7280; margin-bottom:4px;">
                    <span>今日区间</span>
                    <span class="mono" id="mdRangeText">—</span>
                </div>
                <div id="mdDayRange"></div>
            </div>
        </div>
        <div class="md-card">
            <div class="md-card-title">趋势 / 基本面</div>
            <div id="md52W"></div>
            <div class="md-fundamentals-grid" id="mdFundamentals"></div>
        </div>
        <div style="height:24px"></div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
